name: Copy temp file to index.html

on:
  workflow_dispatch:

jobs:
  copy-to-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Copy temp file to index.html
        run: cp temp/marketingx-portfolio-website.html index.html
      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update index.html from temp/marketingx-portfolio-website.html" || echo "No changes to commit"
          git push
