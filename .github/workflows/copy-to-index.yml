name: Copy temp to index

on:
  workflow_dispatch:
  push:
    paths:
      - 'temp/marketingx-portfolio-website.html'

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy temp file to index.html
        run: cp temp/marketingx-portfolio-website.html index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update index.html from temp/marketingx-portfolio-website.html"
          git push
