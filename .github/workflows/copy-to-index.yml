name: Copy temp export to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-to-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy temp file to index.html
        run: cp temp/marketingx-portfolio-website.html index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update index.html from temp export"
          git push
