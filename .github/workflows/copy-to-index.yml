name: Copy site to index
on:
  push:
    branches: [main]
    paths:
      - marketingx-portfolio-website.html
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-to-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy file to index.html
        run: cp marketingx-portfolio-website.html index.html
      - name: Commit index.html if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update index.html from latest marketingx-portfolio-website.html"
          git push
