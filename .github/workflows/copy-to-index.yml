name: Copy temp to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy temp file to index.html
        run: |
          cp temp/marketingx-portfolio-website.html index.html
          ls -l index.html temp/marketingx-portfolio-website.html
      - name: Commit index.html
        run: |
          git config user.name "rajashahnawaz680-stack"
          git config user.email "rajashahnawaz680-stack@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update index.html from temp/marketingx-portfolio-website.html"
          git push
