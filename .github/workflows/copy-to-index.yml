name: Copy site to index

on:
  push:
    branches: [main]
    paths:
      - 'temp/marketingx-portfolio-website.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy fresh site to index.html
        run: |
          cp temp/marketingx-portfolio-website.html index.html
          ls -l index.html temp/marketingx-portfolio-website.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update index.html from temp/marketingx-portfolio-website.html"
          git push
